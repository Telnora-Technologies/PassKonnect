[build]
  # Netlify only installs deps for the package it thinks is "the" project.
  # This is a two-package repo (client/ + server/), and the function lives
  # under server/, so server's own deps (express, serverless-http, Prisma,
  # etc.) need an explicit install here or they never exist on the build
  # machine at all — that was the original failure.
  command = "cd server && npm install && cd ../client && npm install && npm run build"
  publish = "client/dist"
  functions = "server/netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/node_modules/.prisma/client/*.node"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
