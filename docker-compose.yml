services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: passkonnect
      POSTGRES_PASSWORD: passkonnect
      POSTGRES_DB: passkonnect
    ports:
      - "5432:5432"
    volumes:
      - passkonnect-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passkonnect"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the API itself in a container instead of `npm run dev`.
  # Still requires a migrated DB — run `npx prisma migrate deploy` against
  # DATABASE_URL before starting this, since the container doesn't do it
  # automatically.
  app:
    build: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://passkonnect:passkonnect@db:5432/passkonnect
      JWT_SECRET: change-me-in-production
      FRONTEND_URL: http://localhost:5173
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me-in-production

volumes:
  passkonnect-db-data:
